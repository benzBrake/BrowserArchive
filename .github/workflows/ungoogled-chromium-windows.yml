name: ungoogled-chromium Windows Archive

on:
  schedule:
    - cron: "0 17 * * *" # daily 01:00 Beijing time
    - cron: "0 5 * * *" # daily 13:00 Beijing time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ungoogled-chromium-windows-archive
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Scrape latest ungoogled-chromium Windows release
        run: bash scripts/ungoogled_chromium_windows.sh

      - name: Commit ungoogled-chromium Windows data
        run: |
          bash scripts/commit_and_push.sh "chore: update ungoogled-chromium-windows.json" data/ungoogled-chromium-windows.json
