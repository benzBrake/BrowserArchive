name: Whale Archive

on:
  schedule:
    - cron: "0 0 * * *" # daily 08:00 Beijing time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: whale-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full
          pip install internetarchive

      - uses: astral-sh/setup-uv@v5

      - name: Download and extract version
        id: build
        run: |
          chmod +x scripts/build.sh
          VERSION="$(./scripts/build.sh | grep '^VERSION=' | cut -d= -f2)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.build.outputs.version }}" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload installers to Internet Archive
        id: upload
        if: steps.check.outputs.updated == 'true'
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET: ${{ secrets.IA_SECRET }}
        run: |
          chmod +x scripts/upload_ia.sh
          ./scripts/upload_ia.sh whale "${{ steps.build.outputs.version }}" build \
            WhaleSetupX86.exe WhaleSetupX64.exe WhaleSetupARM64.exe | tee ia_output.txt
          echo "item_url=$(grep '^ITEM_URL=' ia_output.txt | cut -d= -f2-)" >> "$GITHUB_OUTPUT"
          grep '^FILE_URL_' ia_output.txt >> "$GITHUB_ENV"

      - name: Create metadata-only release
        if: steps.check.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
          ITEM_URL: ${{ steps.upload.outputs.item_url }}
        run: |
          cd build
          sha256sum WhaleSetupX86.exe WhaleSetupX64.exe WhaleSetupARM64.exe > SHA256SUMS.txt
          gh release create "v${VERSION}" \
            -R "${{ github.repository }}" \
            --title "Naver Whale ${VERSION}" \
            --notes "Naver Whale ${VERSION}

          - Archive: ${ITEM_URL:-https://archive.org/details/whale-archive-${VERSION}}
          - Source: https://installer-whale.pstatic.net/downloads/sa_installers/

          ## Downloads

          - [WhaleSetupX86.exe](${FILE_URL_WhaleSetupX86})
          - [WhaleSetupX64.exe](${FILE_URL_WhaleSetupX64})
          - [WhaleSetupARM64.exe](${FILE_URL_WhaleSetupARM64})

          ## SHA256

          \`\`\`
          $(cat SHA256SUMS.txt)
          \`\`\`" \
            SHA256SUMS.txt

      - name: Update data/whale.json
        env:
          VERSION: ${{ steps.build.outputs.version }}
          ITEM_URL: ${{ steps.upload.outputs.item_url }}
        run: |
          cd build
          ITEM_URL="${ITEM_URL:-https://archive.org/details/whale-archive-${VERSION}}"
          python3 - "$VERSION" "$ITEM_URL" <<'EOF'
          import datetime, hashlib, json, os, sys

          version, item_url = sys.argv[1], sys.argv[2]
          files = {}
          for arch, name in (("x86", "WhaleSetupX86.exe"), ("x64", "WhaleSetupX64.exe"), ("arm64", "WhaleSetupARM64.exe")):
              with open(name, "rb") as f:
                  digest = hashlib.sha256(f.read()).hexdigest()
              files[arch] = {
                  "filename": name,
                  "sha256": digest,
                  "url": f"https://archive.org/download/whale-archive-{version}/{name}",
              }
          data = {
              "name": "Naver Whale",
              "version": version,
              "date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d"),
              "source": "https://installer-whale.pstatic.net/downloads/sa_installers/",
              "archive_item": item_url,
              "files": files,
          }
          os.makedirs("../data", exist_ok=True)
          with open("../data/whale.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write("\n")
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/whale.json
          git commit -m "chore: update whale.json to ${VERSION}" || exit 0
          git push
