name: Chrome Plus Archive
on:
  schedule:
    - cron: "0 17 * * *" # daily 01:00 Beijing time
    - cron: "0 5 * * *" # daily 13:00 Beijing time
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chrome-plus-archive
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Scrape latest Chrome Plus release
        run: bash scripts/chrome_plus.sh
      - name: Commit Chrome Plus data file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/chrome_plus.json
          if git diff --cached --quiet; then
            echo "Chrome Plus data unchanged, skipping commit"
          else
            git commit -m "chore: update chrome_plus.json"
            git push
          fi
