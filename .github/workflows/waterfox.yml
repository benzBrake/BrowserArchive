name: Waterfox Archive

on:
  schedule:
    - cron: "0 17 * * *" # daily 01:00 Beijing time
    - cron: "0 5 * * *" # daily 13:00 Beijing time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: waterfox-archive
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Scrape latest Waterfox release
        run: bash scripts/waterfox.sh
      - name: Commit Waterfox data file
        run: bash scripts/commit_and_push.sh "chore: update waterfox.json" data/waterfox.json
