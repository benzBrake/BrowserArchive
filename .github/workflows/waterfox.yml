name: Waterfox Archive

on:
  schedule:
    - cron: "0 17 * * *" # daily 01:00 Beijing time
    - cron: "0 5 * * *" # daily 13:00 Beijing time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: waterfox-archive
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Scrape latest Waterfox release
        run: bash scripts/waterfox.sh
      - name: Commit Waterfox data file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/waterfox.json
          if git diff --cached --quiet; then
            echo "Waterfox data unchanged, skipping commit"
          else
            git commit -m "chore: update waterfox.json"
            git push
          fi
