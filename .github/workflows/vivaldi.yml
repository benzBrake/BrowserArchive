name: Vivaldi Archive

on:
  schedule:
    - cron: "0 17 * * *" # daily 01:00 Beijing time
    - cron: "0 5 * * *" # daily 13:00 Beijing time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vivaldi-archive
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scrape latest Windows versions and generate data/vivaldi.json
        run: |
          bash scripts/vivaldi.sh

      - name: Commit Vivaldi data file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vivaldi.json
          if git diff --cached --quiet; then
            echo "Vivaldi data unchanged, skipping commit"
          else
            git commit -m "chore: update vivaldi.json"
            git push
          fi
