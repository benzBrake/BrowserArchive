name: Vivaldi Archive

on:
  schedule:
    - cron: "0 17 * * *" # daily 01:00 Beijing time
    - cron: "0 5 * * *" # daily 13:00 Beijing time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vivaldi-archive
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Scrape latest Windows versions and generate data/vivaldi.json
        run: |
          bash scripts/vivaldi.sh

      - name: Commit Vivaldi data file
        run: |
          bash scripts/commit_and_push.sh "chore: update vivaldi.json" data/vivaldi.json
