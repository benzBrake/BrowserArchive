name: Helium Archive

on:
  schedule:
    - cron: "0 17 * * *" # daily 01:00 Beijing time
    - cron: "0 5 * * *" # daily 13:00 Beijing time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: helium-archive
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Scrape latest Helium Windows release
        run: bash scripts/helium.sh

      - name: Commit Helium data file
        run: |
          bash scripts/commit_and_push.sh "chore: update helium.json" data/helium.json
