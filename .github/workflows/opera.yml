name: Opera Archive
on:
  schedule:
    - cron: "0 17 * * *" # daily 01:00 Beijing time
    - cron: "0 5 * * *" # daily 13:00 Beijing time
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: opera-archive
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Generate Opera archive
        run: bash scripts/opera.sh
      - name: Commit Opera data
        run: |
          bash scripts/commit_and_push.sh "chore: update opera.json" data/opera.json
