name: Floorp Archive

on:
  schedule:
    - cron: "0 17 * * *" # daily 01:00 Beijing time
    - cron: "0 5 * * *" # daily 13:00 Beijing time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: floorp-archive
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Scrape latest Floorp Windows release and matching portable build
        run: bash scripts/floorp.sh

      - name: Commit Floorp data file
        run: |
          bash scripts/commit_and_push.sh "chore: update floorp.json" data/floorp.json
