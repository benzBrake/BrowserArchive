name: uBlock Origin Update Manifest

on:
  schedule:
    - cron: "0 17 * * *" # daily 01:00 Beijing time
    - cron: "0 5 * * *" # daily 13:00 Beijing time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ublock-origin-update-manifest
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Generate latest uBlock Origin update manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/ublock_origin.sh

      - name: Commit uBlock Origin update manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ublock-origin.json
          if git diff --cached --quiet; then
            echo "uBlock Origin update manifest unchanged, skipping commit"
          else
            git commit -m "chore: update ublock-origin.json"
            git push
          fi
