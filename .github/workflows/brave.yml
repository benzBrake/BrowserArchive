name: Brave Archive

on:
  schedule:
    - cron: "0 17 * * *" # daily 01:00 Beijing time
    - cron: "0 5 * * *" # daily 13:00 Beijing time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brave-archive
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scrape latest Windows versions and generate data/brave.json + data/brave-origin.json
        run: |
          bash scripts/brave.sh

      - name: Commit Brave data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/brave.json data/brave-origin.json
          if git diff --cached --quiet; then
            echo "Brave data unchanged, skipping commit"
          else
            git commit -m "chore: update brave.json and brave-origin.json"
            git push
          fi
