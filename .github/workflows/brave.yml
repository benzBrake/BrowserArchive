name: Brave Archive

on:
  schedule:
    - cron: "0 17 * * *" # daily 01:00 Beijing time
    - cron: "0 5 * * *" # daily 13:00 Beijing time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brave-archive
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Generate and commit Brave data files
        run: |
          bash scripts/commit_and_push.sh --generate scripts/brave.sh "chore: update brave.json and brave-origin.json" data/brave.json data/brave-origin.json
